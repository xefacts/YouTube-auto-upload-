name: Tier-1 Autonomous YouTube Pipeline

on:
  schedule:
    - cron: '0 13,22 * * *'  # Din mein 2 dafa USA prime time ke mutabiq
  workflow_dispatch: # Mobile se manual click par chalane ke liye

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1-mesa-glx

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 google-generativeai gspread oauth2client opencv-python-headless torch torchvision numpy

      - name: Run Main Autonomous Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
