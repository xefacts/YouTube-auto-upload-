name: YouTube Auto Publish Pipeline

on:
  schedule:
    # 16:00 UTC ≈ 11:00–12:00 ET (before the 2:00 PM ET slot)
    # 23:00 UTC ≈ 6:00–7:00 PM ET (before the 8:00 PM ET slot)
    - cron: "0 16,23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (analyze + log to Google Sheet, never upload). Uncheck to publish live."
        type: boolean
        default: true
  # Manual trigger that works with the Arena GitHub App token (contents:write).
  #   gh api -X POST repos/OWNER/REPO/dispatches -f event_type=publish -f client_payload[dry_run]=true
  repository_dispatch:
    types: [publish]
  # Every push runs a dry run only (never uploads); live publishing happens on
  # schedule, on workflow_dispatch with dry_run unchecked, or on repository_dispatch.
  push:
    branches: [main, "arena/**"]

concurrency:
  group: youtube-auto-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Scan · AI · Sheet · Schedule 2/day
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve run mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          PAYLOAD_DRY_RUN: ${{ github.event.client_payload.dry_run }}
        run: |
          case "$EVENT_NAME" in
            schedule) dry_run="false" ;;
            workflow_dispatch)
              if [ "$INPUT_DRY_RUN" = "true" ]; then dry_run="true"; else dry_run="false"; fi ;;
            repository_dispatch)
              case "$(printf '%s' "$PAYLOAD_DRY_RUN" | tr '[:upper:]' '[:lower:]')" in
                false|no|0) dry_run="false" ;;
                *) dry_run="true" ;;
              esac ;;
            *) dry_run="true" ;;
          esac
          echo "dry_run=$dry_run" >> "$GITHUB_ENV"
          echo "Resolved DRY_RUN=$dry_run (event=$EVENT_NAME)"
          if [ "$dry_run" = "true" ]; then
            echo "::notice title=Run mode::DRY RUN - no YouTube uploads, Google Sheet rows only."
          else
            echo "::notice title=Run mode::LIVE RUN - eligible videos (score>=90, new topic, max 2/day at 14:00/20:00 ET) will be scheduled on YouTube."
          fi

      - name: Require secrets
        env:
          GOOGLE_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DRY_RUN: ${{ env.dry_run }}
        run: |
          missing=0
          if [ -z "$GOOGLE_JSON" ]; then echo "::error::Set secret GOOGLE_CREDENTIALS_JSON"; missing=1; fi
          if [ -z "$GEMINI" ]; then echo "::error::Set secret GEMINI_API_KEY"; missing=1; fi
          # A live run needs either the combined token JSON or the split secrets.
          have_split="false"
          if [ -n "$YT_CLIENT_ID" ] && [ -n "$YT_CLIENT_SECRET" ] && [ -n "$YT_REFRESH_TOKEN" ]; then
            have_split="true"
          fi
          if [ -z "$YT_TOKEN" ] && [ "$have_split" != "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::A live run needs YOUTUBE_TOKEN_JSON or the split secrets YOUTUBE_CLIENT_ID + YOUTUBE_CLIENT_SECRET + YOUTUBE_REFRESH_TOKEN"
            missing=1
          elif [ -z "$YT_TOKEN" ] && [ "$have_split" != "true" ]; then
            echo "::warning::No YouTube credentials; this dry run will not upload"
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Write Google service-account JSON
        env:
          GOOGLE_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$GOOGLE_JSON" > client_secret.json
          chmod 600 client_secret.json

      - name: Write YouTube OAuth token
        env:
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$YT_TOKEN" ]; then
            printf '%s' "$YT_TOKEN" > youtube_token.json
            chmod 600 youtube_token.json
          fi

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1

      - name: Install pinned Python dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            --prefer-binary \
            --only-binary=:all: \
            --no-deps \
            --timeout 60 \
            --retries 4 \
            --requirement requirements.txt
          python -m pip check

      - name: Test pipeline rules
        run: |
          python -m py_compile main.py tests/test_pipeline.py
          python -m unittest discover -s tests -v

      - name: Validate credential JSON
        env:
          DRY_RUN: ${{ env.dry_run }}
        run: python main.py --validate-credentials

      - name: Preflight doctor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          RAW_FOLDER_ID: ${{ vars.RAW_FOLDER_ID || '1-YtW4xKp1qg1TzebJI5qlIjNKzuo_r_J' }}
          PROCESSED_FOLDER_ID: ${{ vars.PROCESSED_FOLDER_ID || '1ftCj1FCSAEdE3qD2HM_1R83zhCwUIiOf' }}
          CHANNEL_NICHE: personal finance and business
          MIN_QUALITY_SCORE: "90"
          MAX_VIDEOS_PER_DAY: "2"
          DAY_SLOT_HOUR: "14"
          NIGHT_SLOT_HOUR: "20"
          DRY_RUN: ${{ env.dry_run }}
        run: python main.py --doctor

      - name: Run publish pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          RAW_FOLDER_ID: ${{ vars.RAW_FOLDER_ID || '1-YtW4xKp1qg1TzebJI5qlIjNKzuo_r_J' }}
          PROCESSED_FOLDER_ID: ${{ vars.PROCESSED_FOLDER_ID || '1ftCj1FCSAEdE3qD2HM_1R83zhCwUIiOf' }}
          CHANNEL_NICHE: personal finance and business
          MIN_QUALITY_SCORE: "90"
          MAX_VIDEOS_PER_DAY: "2"
          DAY_SLOT_HOUR: "14"
          NIGHT_SLOT_HOUR: "20"
          DRY_RUN: ${{ env.dry_run }}
        run: |
          mkdir -p work
          set +e
          python main.py 2>&1 | tee work/pipeline.log
          pipeline_status=${PIPESTATUS[0]}
          set -e
          if [ "$pipeline_status" -ne 0 ]; then
            PIPELINE_STATUS="$pipeline_status" python - <<'PY'
          import os
          from pathlib import Path
          import main
          log_path = Path("work/pipeline.log")
          text = log_path.read_text(errors="replace") if log_path.exists() else ""
          text = main.sanitize(text)
          log_path.write_text(text)
          lines = [line for line in text.splitlines() if line.strip()]
          detail = "\n".join(lines[-12:])[-2400:] or "Pipeline exited without captured output."
          escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Pipeline failed::{escaped}")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "## Pipeline failed\n\n"
              f"Exit status: `{os.environ.get('PIPELINE_STATUS', 'non-zero')}`\n\n"
              "```\n" + detail + "\n```\n"
          )
          PY
          fi
          exit "$pipeline_status"

      - name: Write job summary
        if: always()
        run: |
          if [ -f work/pipeline.log ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import main
          text = main.sanitize(Path("work/pipeline.log").read_text(errors="replace"))
          lines = [line for line in text.splitlines() if line.strip()]
          print("## Pipeline log (tail)")
          print("```")
          print("\n".join(lines[-40:]))
          print("```")
          PY
          fi

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pipeline-log
          path: work/pipeline.log
          if-no-files-found: ignore
          retention-days: 7
