name: YouTube Auto Publish Pipeline

on:
  schedule:
    # 13:00 UTC ≈ 09:00 ET  and  22:00 UTC ≈ 18:00 ET  — before day & night slots
    - cron: "0 13,22 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write Google service-account JSON
        env:
          GOOGLE_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$GOOGLE_JSON" > client_secret.json

      - name: Write YouTube OAuth token (optional)
        env:
          YT_TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$YT_TOKEN" ]; then
            printf '%s' "$YT_TOKEN" > youtube_token.json
          fi

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          DRY_RUN: "false"
        run: python main.py
