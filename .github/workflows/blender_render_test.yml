name: Blender Headless Render Test

# Manually-triggered feasibility test ONLY. Verifies, empirically, whether a
# GitHub Actions ubuntu-latest runner (full internet + apt access, unlike the
# Arena sandbox where `import bpy` fails on missing libGL/libX11) can:
#   1. download the official portable Blender Linux build,
#   2. run it headlessly (`blender -b`) to build+animate a scene via bpy,
#   3. render frames with Cycles on CPU (no GPU on hosted runners),
#   4. encode them into an MP4 with ffmpeg.
# No secrets are required or used. Public repo => Actions minutes are free.

on:
  workflow_dispatch:
    inputs:
      frames:
        description: "Number of frames to render"
        required: false
        default: "24"
  # workflow_dispatch only fires for workflow files already on the default
  # branch, which we deliberately never push to from this session. Trigger
  # on push instead so the test actually runs from this feature branch.
  push:
    branches:
      - "arena/0abc33e0-youtube-auto-upload"
    paths:
      - ".github/workflows/blender_render_test.yml"
      - "blender_test/**"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: System info (for the feasibility report)
        run: |
          nproc
          free -h
          df -h .
          ffmpeg -version | head -1 || echo "ffmpeg NOT preinstalled"

      - name: Download official Blender portable build
        run: |
          curl -L -o blender.tar.xz https://mirror.blender.org/release/Blender4.2/blender-4.2.7-linux-x64.tar.xz
          tar -xf blender.tar.xz
          mv blender-4.2.7-linux-x64 blender-portable
          echo "${GITHUB_WORKSPACE}/blender-portable" >> "$GITHUB_PATH"

      - name: Verify Blender runs headlessly
        run: |
          blender-portable/blender --version
          blender-portable/blender -b --python-expr "import bpy; print('bpy OK, version', bpy.app.version_string)"

      - name: Render test scene (Cycles, CPU)
        env:
          FRAMES_INPUT: ${{ inputs.frames }}
        run: |
          mkdir -p blender_test/out
          FRAMES="${FRAMES_INPUT:-12}"
          echo "Rendering $FRAMES frames"
          # --python-exit-code makes a Python exception inside scene.py a
          # real nonzero process exit, instead of Blender's default of
          # silently swallowing the error and exiting 0 (which is exactly
          # what hid a bug -- an empty --frames value -- in the first run
          # of this workflow: the step reported success with zero frames
          # actually rendered).
          time blender-portable/blender -b -noaudio --python-exit-code 1 \
            -P blender_test/scene.py -- --out blender_test/out --frames "$FRAMES"
          echo "--- contents of blender_test/out ---"
          ls -la blender_test/out
          test -f blender_test/out/frame_0001.png || (echo "::error::no frames were rendered" && exit 1)

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Encode MP4 with ffmpeg
        run: |
          ffmpeg -y -framerate 24 -i blender_test/out/frame_%04d.png -c:v libx264 -pix_fmt yuv420p blender_test/out/sample.mp4
          ls -la blender_test/out/sample.mp4

      - name: Upload render artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-render-test-${{ github.run_id }}
          path: |
            blender_test/out/sample.mp4
            blender_test/out/*.png
          retention-days: 7

      # actions/upload-artifact and `gh run view --log` both resolve through
      # Azure Blob Storage / results-receiver hosts that are NOT reachable
      # from the Arena agent sandbox's network allowlist, so the artifact
      # above cannot actually be pulled back in for a genuine pixel-level
      # inspection. Commit a couple of the real rendered PNGs (small, low
      # frame count) straight into the repo instead, which IS fetchable via
      # a normal `git pull` / codeload.github.com. [skip ci] prevents this
      # commit from re-triggering this same push-based workflow.
      - name: Commit sample frames for sandbox inspection
        if: always()
        run: |
          mkdir -p blender_test/verified_output
          rm -f blender_test/verified_output/*.png
          cp blender_test/out/frame_0001.png blender_test/verified_output/ 2>/dev/null || true
          LAST=$(ls blender_test/out/frame_*.png 2>/dev/null | sort | tail -1)
          if [ -n "$LAST" ]; then cp "$LAST" blender_test/verified_output/; fi
          MID=$(ls blender_test/out/frame_*.png 2>/dev/null | sort | awk '{a[NR]=$0} END{print a[int(NR/2)+1]}')
          if [ -n "$MID" ]; then cp "$MID" blender_test/verified_output/; fi
          echo "run_id=${{ github.run_id }}, workflow_sha=${{ github.sha }}" > blender_test/verified_output/RUN_INFO.txt
          ls -la blender_test/verified_output
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blender_test/verified_output
          git diff --cached --quiet || git commit -m "Blender Actions run ${{ github.run_id }}: real rendered sample frames for sandbox inspection [skip ci]"
          git push || echo "nothing to push"
