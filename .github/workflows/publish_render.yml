name: Publish Render Result

# Sandbox network allowlist blocks artifact blob downloads (blob.core.windows.net).
# This job runs INSIDE Actions (full network), downloads the render artifact,
# and commits the deliverables to the branch so they are fetchable via git.

on:
  push:
    branches: [arena/**]
    paths:
      - 'video_studio/render_jobs/PUBLISH'

permissions:
  contents: write

concurrency:
  group: publish-render
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read publish request
        run: |
          set -euo pipefail
          grep -E '^(RUN_ID|JOB_ID)=' video_studio/render_jobs/PUBLISH >> "$GITHUB_ENV" || true
          cat video_studio/render_jobs/PUBLISH

      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          run-id: ${{ env.RUN_ID }}
          name: blender-render
          path: art
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit deliverables to branch
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          DEST="video_studio/outputs/${JOB_ID:-JOB-0001}"
          mkdir -p "$DEST"
          cp art/sample.mp4 "$DEST/" 2>/dev/null || echo "WARN: no sample.mp4"
          cp art/render_report.json art/timing.json art/render_log.txt "$DEST/" 2>/dev/null || true
          # contact sheet (best-effort; never blocks the commit)
          set +e
          for f in $(ls art/frame_*.png | sort | awk 'NR%12==1' | head -6); do
            ffmpeg -y -loglevel error -i "$f" -vf scale=270:-1 "art/s_$(basename "$f" .png).jpg"
          done
          ffmpeg -y -loglevel error -pattern_type glob -i 'art/s_frame_*.jpg' \
            -filter_complex tile=3x2 -frames:v 1 "$DEST/contact_sheet.jpg"
          set -e
          git config user.name "render-bot" && git config user.email "actions@github.com"
          for i in 1 2 3; do
            git add -f "$DEST"
            if git commit -m "render: publish $JOB_ID result (run $RUN_ID)"; then
              if git push; then echo PUBLISHED; break; fi
            fi
            git pull --rebase || true
          done

